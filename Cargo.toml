[package]
name = "terminal-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# `websocket` retains the prior `--mode websocket` transport (axum lives behind
# this mcp-core feature, not as a direct dep here); `unix` is on by default.
mcp-core = { git = "https://github.com/adelie-ai/mcp-core", features = ["websocket"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.0"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[target."cfg(unix)".dependencies]
libc = "0.2.186"
