[package]
name = "terminal-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# This server serves stdio and no other transport. The websocket transport is
# deliberately NOT compiled in (and is additionally refused via
# `ServerConfig::without_websocket`): terminal-mcp executes arbitrary shell
# commands and mcp-core's ws transport is unauthenticated, so
# `serve --transport websocket --host 0.0.0.0` would be a remote shell.
# mcp-core's `unix` feature is on by default, so that transport is compiled in,
# but `server_config` never opts into it, so the server refuses it too.
mcp-core = { git = "https://github.com/adelie-ai/mcp-core" }
clap = { version = "4.5.54", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
# Spans, events and metrics on this server's own execution path. Already in
# the tree through mcp-core -> adelie-telemetry, so naming it directly adds no
# crate.
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.0"
# A capturing `Layer` for the telemetry acceptance tests: they read back the
# spans and events the execution path really produced. Already in the tree
# through adelie-telemetry, so this adds no crate.
tracing-subscriber = "0.3.23"

[features]
# OTLP export of traces, metrics and log records, passed through to mcp-core
# (which passes it through to adelie-telemetry). Off by default: with it off
# no opentelemetry crate is resolved at all, and console logging plus the
# in-process metrics summary work unchanged. Configure with the standard
# `OTEL_*` environment variables (see the README's Logging section).
otel = ["mcp-core/otel"]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[target."cfg(unix)".dependencies]
libc = "0.2.186"

# Release profiles. Default favors small, fast binaries (strip + thin LTO).
# Build variants: `cargo build --profile release-fast` / `--profile release-small`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.release-fast]
inherits = "release"
lto = "fat"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true
